<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>日本の鉄道駅R*Tree</title>
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
      html, body, #map {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }
      /* 右上にファイル選択ボタンを配置 */
      .file-control {
        position: absolute;
        top: 10px;
        right: 10px;
        z-index: 1000;
        background: white;
        padding: 8px 12px;
        border-radius: 6px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        font-family: sans-serif;
        font-size: 14px;
      }
      .file-control label {
        cursor: pointer;
        font-weight: bold;
        color: #333;
      }
      .file-control input[type="file"] {
        display: none; /* デフォルトの不格好なボタンを隠す */
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <!-- UIコントロール: ファイル選択ボタン -->
    <div class="file-control">
      <label for="json-file-input" data-i18n="selectFile">📂 ローカルの mbr.json を選択</label>
      <input type="file" id="json-file-input" accept=".json" />
      <!-- 言語切り替え用ボタン -->
      <select id="lang-select">
        <option value="ja">日本語</option>
        <option value="en">English</option>
      </select>
    </div>
    <script type="module" src="/dist/main.js"></script>
  </body>
</html>
